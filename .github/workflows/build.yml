name: Compilar APK

on:
  push:
    branches: [tv-limpia]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TVLimpia-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TVLimpia.apk
          gh release delete tv-limpia-apk -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create tv-limpia-apk TVLimpia.apk --prerelease --target ${{ github.sha }} -t "TV Limpia" -n "APK de TV Limpia" -R ${{ github.repository }}
