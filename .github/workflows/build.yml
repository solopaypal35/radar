name: Crear APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Incluir radares de España (OpenStreetMap)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets
          Q='[out:json][timeout:90];(node["highway"="speed_camera"](35.1,-9.6,43.9,4.5);node["highway"="speed_camera"](27.5,-18.3,29.5,-13.3););out body;'
          for URL in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "Probando $URL"
            if curl -sf --max-time 120 -A "AvisaRadar-build" --data-urlencode "data=$Q" "$URL" -o app/src/main/assets/radares.json \
               && grep -q '"lat"' app/src/main/assets/radares.json; then
              echo "Radares incluidos: $(grep -o '"lat"' app/src/main/assets/radares.json | wc -l)"
              cp app/src/main/assets/radares.json datos/radares.json
              exit 0
            fi
          done
          cp datos/radares.json app/src/main/assets/radares.json
          echo "Servidor sin respuesta: se usa la copia guardada ($(grep -o '"lat"' app/src/main/assets/radares.json | wc -l) radares)"

      - name: Incluir radares de tramo (OpenStreetMap)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets datos
          Q='[out:json][timeout:90];(relation["enforcement"="average_speed"](35.1,-9.6,43.9,4.5);relation["enforcement"="average_speed"](27.5,-18.3,29.5,-13.3););out body;>;out skel qt;'
          for URL in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "Probando $URL"
            if curl -sf --max-time 120 -A "AvisaRadar-build" --data-urlencode "data=$Q" "$URL" -o app/src/main/assets/tramos.json \
               && grep -q '"relation"' app/src/main/assets/tramos.json; then
              echo "Tramos incluidos: $(grep -o '"type": "relation"' app/src/main/assets/tramos.json | wc -l)"
              cp app/src/main/assets/tramos.json datos/tramos.json
              exit 0
            fi
          done
          if [ -f datos/tramos.json ]; then cp datos/tramos.json app/src/main/assets/tramos.json; echo "Se usa la copia guardada de tramos"; else rm -f app/src/main/assets/tramos.json; echo "Sin tramos"; fi

      - name: Incluir semáforos con cámara y peajes (OpenStreetMap)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets datos
          descargar() {
            NOMBRE=$1; Q=$2; PRUEBA=$3
            for URL in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              if curl -sf --max-time 120 -A "AvisaRadar-build" --data-urlencode "data=$Q" "$URL" -o app/src/main/assets/$NOMBRE.json \
                 && grep -q "$PRUEBA" app/src/main/assets/$NOMBRE.json; then
                echo "$NOMBRE incluidos desde $URL"
                cp app/src/main/assets/$NOMBRE.json datos/$NOMBRE.json
                return 0
              fi
            done
            if [ -f datos/$NOMBRE.json ]; then cp datos/$NOMBRE.json app/src/main/assets/$NOMBRE.json; echo "$NOMBRE: se usa la copia guardada"; else rm -f app/src/main/assets/$NOMBRE.json; echo "$NOMBRE: sin datos"; fi
          }
          descargar semaforos '[out:json][timeout:90];(relation["enforcement"="traffic_signals"](35.1,-9.6,43.9,4.5);relation["enforcement"="traffic_signals"](27.5,-18.3,29.5,-13.3););out body;>;out skel qt;' '"relation"'
          descargar peajes '[out:json][timeout:90];(node["barrier"="toll_booth"](35.1,-9.6,43.9,4.5);node["barrier"="toll_booth"](27.5,-18.3,29.5,-13.3););out body;' '"lat"'

      - name: Guardar copia de los datos en el repositorio
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "AvisaRadar"
          git config user.email "avisaradar@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || (git commit -m "Actualiza la copia de datos [skip ci]" && git push)

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AvisaRadar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AvisaRadar
          path: AvisaRadar.apk

      - name: Publicar descarga directa
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          sleep 5
          gh release create ultima AvisaRadar.apk --title "AvisaRadar (última versión)" --notes "Descarga AvisaRadar.apk e instálala en el móvil."

      - name: Publicar versión de pruebas (no sustituye a la oficial)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pruebas --yes --cleanup-tag || true
          sleep 5
          gh release create pruebas AvisaRadar.apk --prerelease --target "$GITHUB_SHA" --title "AvisaRadar (pruebas)" --notes "Versión de pruebas."
